[package]
name = "mcp-pinchtask"
version = "0.1.0"
description = "A task management server based on Model Context Protocol (MCP), providing structured task management for AI agents"
authors = ["Raven"]
edition = "2021"
license = "MIT"
keywords = ["mcp", "task-manager", "agent", "workflow", "ai"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/ravenxrq/mcp-pinchtask"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
