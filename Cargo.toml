[package]
name = "pinchtask"
version = "0.2.1"
description = "A task management server based on Model Context Protocol (MCP), providing structured task management for AI agents"
authors = ["Raven"]
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
keywords = ["mcp", "task-manager", "agent", "workflow", "ai"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/Raven-1027/pinchtask"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"], default-features = false }
ratatui = { version = "0.30.0", optional = true }
crossterm = { version = "0.29.0", optional = true }
rmcp = { version = "1.3.0", features = ["server", "macros", "transport-io"], default-features = false }
schemars = "1"

[features]
default = []
all = ["tui"]
tui = ["ratatui", "crossterm"]

[dev-dependencies]
tempfile = "3"
