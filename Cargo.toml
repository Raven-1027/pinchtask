[package]
name = "mcp-pinchtask"
version = "0.1.0"
description = "A Rust-based MCP task manager inspired by mcp-shrimp-task-manager"
authors = ["Raven"]
edition = "2021"
license = "MIT"
keywords = ["mcp", "task-manager", "agent", "workflow"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
